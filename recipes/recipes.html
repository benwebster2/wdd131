<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecipeBook</title>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="recipes.css"/>
    </head>
<body>

  <header>
    <div class="logo">
      <img src="images/recipe-book.png" alt="RecipeBook Logo">
      <h1>RECIPEBOOK</h1>
    </div>
    <div class="search-bar">
      <input type="text" placeholder="Find a recipe">
      <button>🔍</button>
    </div>
  </header>

  <main>
    <article class="recipe-card">
      <div class="recipe-image">
        <img src="images/apple-crisp.jpg" alt="Apple Crisp">
      </div>
      
      <div class="recipe-content">
        <span class="tag">dessert</span>
        <h2>APPLE CRISP</h2>
        
        <p class="description">This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
      </div>
    </article>
  </main>

  <footer>
    <div class="social">
        <img src="images/instagram_icon.svg" alt="Instagram">
        <img src="images/youtube_icon.svg" alt="YouTube">
        <img src="images/pinterest_icon.svg" alt="Pinterest">
       </div>
    <p><a href="https://www.flaticon.com/..." title="recipe icons">Recipe icons created by Freepik - Flaticon</a></p>
  </footer>

</body>
</html>
