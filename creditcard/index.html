
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Card</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="credit.css"/>
    <script src="credit.js" defer></script>
  </head>
  <body>
    <header><h1>TOTAL: $199                            💳 </h1></header>
    <main>
      <section class="errors"></section>
      <form id="checkoutForm" action="completed.html" method="get">
        <label for="total"></label>
        <!-- Container for credit card details -->
        <p id="creditCardNumberContainer" class="hide" role="region" aria-labelledby="creditCardLabel">
            <label id="creditCardLabel" for="creditCardNumber">CARD NUMBER</label>
            <input
            type="text"
            id="creditCardNumber"
            name="creditCardNumber"
            pattern="[0-9]{16}"
            placeholder="1234 5678 9101 1020"
            required
            />
            <label id="creditCardHold" for="creditCardHold">CARD HOLDER</label>
            <input
            type="text"
            id="creditCardHolder"
            name="creditCardHold"
            pattern="[0-9]{16}"
            placeholder="John Doe"
            required
            />
            <label for="expirationDate">EXPIRATION</label>
            <input 
            type="text" 
            id="month" 
            name="expMonth" 
            placeholder="MM" 
            aria-labelledby="expirationDate">
            <input 
            type="text" 
            id="year" 
            name="expYear" 
            placeholder="YY" 
            aria-labelledby="expirationDate">
            <label for="cvc/cvv">CVC/CVV</label>
            <input 
            type="text" 
            id="cvc/cvv" 
            name="cvc/cvv" 
            placeholder="xxx" 
            aria-labelledby="cvc/cvv">
        </p>
      
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
